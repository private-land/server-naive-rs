name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  BINARY_NAME: server-naive

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every target finish independently — diagnosing one failure is
      # easier when the other artifacts have actually built.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Configure git auth for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GIT_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (GNU)
        if: contains(matrix.target, '-gnu')
        run: |
          if [[ "${{ matrix.target }}" == aarch64-* ]]; then
            sudo apt-get update
            # g++ + binutils are required so boring-sys's cc-crate build
            # script picks an aarch64-targeting C/C++ toolchain instead of
            # the host's x86_64 cc (the original failure: BoringSSL .o files
            # were ELF EM:62 = x86_64 and the linker rejected them).
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu
          fi

      # MUSL toolchain split by arch:
      #   x86_64-musl builds fine with zig (cargo-zigbuild).
      #   aarch64-musl does NOT: zig's C build of aws-lc-sys drops cbs.o
      #   (CBS/bytestring), so aws-lc's own ASN.1 objects fail to link with
      #   undefined aws_lc_*_CBS_*. aarch64-musl therefore uses a real
      #   aarch64-linux-musl-gcc cross toolchain (same idea as aarch64-gnu
      #   using real gcc), which produces a complete aws-lc archive.
      - name: Install zig (x86_64 MUSL)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild (x86_64 MUSL)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo install cargo-zigbuild

      - name: Install musl cross toolchain (aarch64 MUSL)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          set -euo pipefail
          # GitHub-CDN-hosted musl-cross toolchain (reliable from Actions;
          # musl.cc throttles cloud IPs and times out). Pinned release.
          # Extracts to /opt/aarch64-unknown-linux-musl with the
          # aarch64-unknown-linux-musl-* tool prefix.
          url="https://github.com/cross-tools/musl-cross/releases/download/20260515/aarch64-unknown-linux-musl.tar.xz"
          curl -fL --retry 5 --retry-delay 5 --retry-connrefused \
            --connect-timeout 30 --max-time 600 -o /tmp/aarch64-musl.tar.xz "$url"
          sudo tar -xJf /tmp/aarch64-musl.tar.xz -C /opt
          echo "/opt/aarch64-unknown-linux-musl/bin" >> "$GITHUB_PATH"
          /opt/aarch64-unknown-linux-musl/bin/aarch64-unknown-linux-musl-gcc --version | head -1

      # rust-cache is intentionally NOT used for release builds: it had cached
      # a partial aws-lc-sys archive across runs. Release builds are
      # infrequent, so build clean every time.

      - name: Build (GNU)
        if: contains(matrix.target, '-gnu')
        env:
          # Rust linker (final binary).
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          # cc-crate build scripts (boring-sys, libz-ng-sys, zstd-sys, ...).
          # Underscore form because env-var names can't contain dashes.
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (x86_64 MUSL, zigbuild)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build (aarch64 MUSL, real musl-gcc)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-unknown-linux-musl-gcc
          CC_aarch64_unknown_linux_musl: aarch64-unknown-linux-musl-gcc
          CXX_aarch64_unknown_linux_musl: aarch64-unknown-linux-musl-g++
          AR_aarch64_unknown_linux_musl: aarch64-unknown-linux-musl-ar
          # bindgen (boring-sys, aws-lc-sys) runs libclang, which otherwise
          # reads the host glibc headers and fails ('bits/libc-header-start.h'
          # not found). Point it at the musl toolchain sysroot.
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_musl: "--target=aarch64-unknown-linux-musl --sysroot=/opt/aarch64-unknown-linux-musl/aarch64-unknown-linux-musl/sysroot"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz ${{ env.BINARY_NAME }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: cd artifacts && sha256sum *.tar.gz > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
